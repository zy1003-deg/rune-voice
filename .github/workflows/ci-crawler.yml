name: CI · Crawler

on:
  push:
    branches: [main, master]
    paths:
      - "core/**"
      - "store/**"
      - "utils/**"
      - "config.py"
      - "main.py"
      - "web/*.py"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci-crawler.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "core/**"
      - "store/**"
      - "utils/**"
      - "config.py"
      - "main.py"
      - "web/*.py"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci-crawler.yml"

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Run pytest
        run: pytest tests/ -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Lint smoke (CLI entry help)
        # Sanity: the entry point must at least parse and emit --help
        # without requiring network access.
        run: python main.py --help

      - name: Lint smoke (dev server help)
        run: python -c "import web.serve" 2>/dev/null || python -c "import importlib.util, pathlib; spec = importlib.util.spec_from_file_location('serve', pathlib.Path('web/serve.py')); mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); print('serve.py importable')"
