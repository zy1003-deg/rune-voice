name: Bug report
description: Report a reproducible bug in the Rune Voice SPA, crawler, or data pipeline.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the
        template below — the more concrete the reproduction, the faster we
        can triage.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        1. ...
        2. ...
        3. ...
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: entity
    attributes:
      label: Entity / skin involved (if any)
      placeholder: e.g. Demo Champion / Demo Skin

  - type: input
    id: audio_url
    attributes:
      label: Failing audio URL (if any)
      placeholder: e.g. https://example.com/demo-champion/demo-skin/demo_voice_001.mp3

  - type: dropdown
    id: surface
    attributes:
      label: Which part of the project?
      options:
        - Frontend SPA (web/)
        - Python crawler (main.py / core/)
        - Data-prep scripts (web/generate_*.py)
        - Deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Python / Node versions, branch / commit.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste console output or attach screenshots. DO NOT paste secrets.
