name: Feature request
description: Propose a new feature for the Rune Voice archive or SPA.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user value, not just the implementation. If you can,
        link to existing champions/skins/voices that demonstrate the need.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How would you solve it? Frontend only? Backend? New metadata field?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Affected champions / skins / files
      description: List specific files or champions if you can.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
